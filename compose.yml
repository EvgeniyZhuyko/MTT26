services:

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment the block below for NVIDIA GPU passthrough on Linux.
    # Required: NVIDIA driver ≥525 + nvidia-container-toolkit.
    # macOS and CPU-only Ubuntu: leave this commented out.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      # Provides the GGUF file to the entrypoint for model registration.
      - ./training:/app/training:ro
    depends_on:
      - ollama
    restart: on-failure

  chat:
    build: ./chat
    ports:
      - "8081:8081"
    environment:
      - AGENT_URL=http://agent:8080
    depends_on:
      - agent
    restart: on-failure

volumes:
  ollama_data:
