<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalScript Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 820px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 24px rgba(0,0,0,0.08);
    }

    header {
      padding: 14px 20px;
      background: #1a1a2e;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    header span {
      font-weight: 300;
      opacity: 0.6;
      font-size: 13px;
      margin-left: 8px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    #empty {
      margin: auto;
      text-align: center;
      color: #aaa;
      font-size: 14px;
      line-height: 1.8;
    }

    .msg { display: flex; flex-direction: column; max-width: 88%; }
    .msg.user      { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .msg.error     { align-self: center; max-width: 100%; }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #1a73e8;
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .msg.error .bubble {
      background: #fce8e6;
      color: #c5221f;
      border-radius: 8px;
      font-size: 13px;
    }

    /* assistant: code block */
    .code-wrap {
      position: relative;
    }

    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 14px 16px;
      border-radius: 10px;
      overflow-x: auto;
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace,
                   "SF Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.65;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #aaa;
      padding: 3px 10px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

    .meta {
      font-size: 11px;
      color: #aaa;
      margin-top: 5px;
      padding-left: 2px;
    }

    .lint-warn {
      background: #fff8e1;
      color: #7b5800;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 6px;
      border-left: 3px solid #f9ab00;
    }

    /* input bar */
    #form {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid #e8eaed;
      background: #fff;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #dadce0;
      border-radius: 24px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    #input:focus { border-color: #1a73e8; }

    #send {
      padding: 10px 22px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #send:hover:not(:disabled) { background: #1558b0; }
    #send:disabled { background: #c5c5c5; cursor: default; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      LocalScript Chat
      <span>Octapi Lua generator</span>
    </header>

    <div id="messages" role="log" aria-live="polite">
      <div id="empty">
        Describe what the Lua script should do.<br>
        Russian and English are both supported.
      </div>
    </div>

    <form id="form" autocomplete="off">
      <input
        id="input"
        type="text"
        placeholder="e.g. Get the last email from the list"
        autofocus
      >
      <button type="submit" id="send">Send</button>
    </form>
  </div>
  <!-- INJECT_JS -->
</body>
</html>
